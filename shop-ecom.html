  <!-- Ecommerce logic -->
  <script>
  // Use products from window
  const products = window.products || [];

  // Provisional catalogue ranges preserved. Fictitious midpoint mutation removed.

  const ITEMS_PER_PAGE = 12;
  let currentPage = 1;
  let currentCurrency = 'INR';
  const currencyRates = { INR:1, USD:1/83, EUR:1/95, GBP:1/110 };
  let cart = JSON.parse(localStorage.getItem('gon_cart') || '{}');
  const SHIPPING = 200;

  // extra filter state for pills
  const filterState = {
    priceMin: null,
    priceMax: null,
    ppcMin: null,
    ppcMax: null,
    wtMin: null,
    wtMax: null,
    rattiMin: null,
    rattiMax: null,
    certs: [],
    origins: []
  };

  // Stage 4B: Gemological attribute extraction and dynamic filter audit
  function getCaratWeight(p) {
    if (!p) return null;
    if (typeof p.caratWeight === 'number' && Number.isFinite(p.caratWeight)) return p.caratWeight;
    if (typeof p.carat === 'number' && Number.isFinite(p.carat)) return p.carat;
    if (typeof p.weight_carat === 'number' && Number.isFinite(p.weight_carat)) return p.weight_carat;
    return null;
  }

  function getRattiWeight(p) {
    if (!p) return null;
    if (typeof p.rattiWeight === 'number' && Number.isFinite(p.rattiWeight)) return p.rattiWeight;
    if (typeof p.ratti === 'number' && Number.isFinite(p.ratti)) return p.ratti;
    if (typeof p.weight_ratti === 'number' && Number.isFinite(p.weight_ratti)) return p.weight_ratti;
    return null;
  }

  function getPricePerCarat(p) {
    if (!p) return null;
    if (typeof p.price_per_carat === 'number' && Number.isFinite(p.price_per_carat)) return p.price_per_carat;
    if (typeof p.ppc === 'number' && Number.isFinite(p.ppc)) return p.ppc;
    const cw = getCaratWeight(p);
    const price = typeof p.finalPrice === 'number' && p.finalPrice > 0 ? p.finalPrice : null;
    if (price != null && cw != null && cw > 0) {
      return Math.round(price / cw);
    }
    return null;
  }

  function getCertification(p) {
    if (!p) return null;
    const cert = p.certLab || p.certification || (p.certStatus === 'CERTIFIED' || p.certNumber ? 'Certified' : null);
    return cert ? String(cert).trim() : null;
  }

  function getOrigin(p) {
    if (!p || !p.origin) return null;
    return String(p.origin).trim();
  }

  // Precompute unique certifications & origins across loaded dataset
  const uniqueCerts = [...new Set(products.map(p => getCertification(p)).filter(Boolean))];
  const uniqueOrigins = [...new Set(products.map(p => getOrigin(p)).filter(Boolean))];

  function auditFilterAvailability() {
    return {
      hasPrice: true,
      hasPpc: products.some(p => getPricePerCarat(p) != null),
      hasCarat: products.some(p => getCaratWeight(p) != null),
      hasRatti: products.some(p => getRattiWeight(p) != null),
      hasCert: uniqueCerts.length > 0,
      hasOrigin: uniqueOrigins.length > 0
    };
  }

  function updateFilterPillsDisplay() {
    const avail = auditFilterAvailability();
    const filterMap = {
      'price-per-carat': avail.hasPpc,
      'weight-carat': avail.hasCarat,
      'weight-ratti': avail.hasRatti,
      'certification': avail.hasCert,
      'origin': avail.hasOrigin
    };

    Object.entries(filterMap).forEach(([filterName, isAvailable]) => {
      const pill = document.querySelector(`.filter-pill[data-filter="${filterName}"]`);
      if (!pill) return;
      const existingBadge = pill.querySelector('.lot-badge');
      if (!isAvailable) {
        pill.setAttribute('title', 'Attribute confirmed upon physical lot selection. Click for details.');
        if (!existingBadge) {
          const badge = document.createElement('span');
          badge.className = 'lot-badge text-[9px] text-amber-800 bg-amber-50 border border-amber-200 px-1 py-0.5 rounded font-normal ml-0.5';
          badge.textContent = 'Lot';
          const arrow = pill.querySelector('.arrow');
          if (arrow) {
            pill.insertBefore(badge, arrow);
          } else {
            pill.appendChild(badge);
          }
        }
      } else {
        pill.removeAttribute('title');
        if (existingBadge) existingBadge.remove();
      }
    });
  }

  function formatCurrency(value, currency='INR'){
    if (value==null) return '';
    if (currency==='INR') return '₹' + Number(value).toLocaleString('en-IN');
    const symbol = currency==='USD' ? '$' : currency==='EUR' ? '€' : '£';
    return symbol + (value * currencyRates[currency]).toFixed(2);
  }

  function formatProductPriceDisplay(prod, currency='INR') {
    if (!prod) return '';
    if (typeof prod.finalPrice === 'number' && prod.finalPrice > 0) {
      return formatCurrency(prod.finalPrice, currency);
    }
    const min = prod.price_min || 0;
    const max = prod.price_max || min;
    if (min === max) {
      return formatCurrency(min, currency) + ' <span class="text-[10px] text-gray-500 font-normal">(est.)</span>';
    }
    return formatCurrency(min, currency) + ' – ' + formatCurrency(max, currency) + ' <span class="text-[10px] text-gray-500 font-normal">(est.)</span>';
  }

  function getProductPrice(prod) {
    if (!prod) return 0;
    if (typeof prod.finalPrice === 'number') return prod.finalPrice;
    if (typeof prod.price_min === 'number') return prod.price_min;
    if (typeof prod.price_max === 'number') return prod.price_max;
    const raw = String(prod.price || prod.price_min || prod.price_max || '');
    const num = parseFloat(raw.replace(/[^0-9.-]/g, ''));
    return isNaN(num) ? 0 : num;
  }

  function renderProductCard(p, cardIndex = 0){
    const div = document.createElement('div');
    div.className = 'bg-white rounded-2xl border border-[#E8E2D5] hover:border-[#C5A869]/70 shadow-sm hover:shadow-xl transition-all duration-300 product-card flex flex-col justify-between overflow-hidden group';
    div.setAttribute('data-id', p.id);
    const safeName = (p.name || '').replace(/"/g, '&quot;');
    const isEager = cardIndex < 4;
    div.innerHTML = `
      <div class="relative h-52 bg-stone-100 overflow-hidden cursor-pointer" onclick="openProductDetail('${p.id}')">
        <img src="${p.image}" onerror="this.onerror=null; this.src='/images/hero-bg.jpg';" alt="${safeName}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="${isEager ? 'eager' : 'lazy'}" decoding="async" />
        <div class="product-overlay">
          <div class="w-full text-xs text-white line-clamp-3 leading-relaxed">${p.description || ''}</div>
        </div>
      </div>
      <div class="p-4 sm:p-5 flex flex-col justify-between flex-1">
        <div>
          <span class="inline-block px-2.5 py-0.5 rounded-md bg-[#EAF4F0] text-[#0A3A2F] text-[10px] font-semibold uppercase tracking-wider mb-1.5">${p.category || 'Gemstone'}</span>
          <h4 class="font-display text-lg font-semibold text-[#0A3A2F] leading-snug cursor-pointer group-hover:text-[#0D473A] transition" onclick="openProductDetail('${p.id}')">${p.name}</h4>
        </div>

  function applyFilters(){
    const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const catSelect = document.getElementById('category-filter');
    const cat = catSelect ? catSelect.value : 'all';
    const sort = document.getElementById('sort-select').value;

    let out = products.filter(p => {
      // category
      if (cat !== 'all' && p.category !== cat) return false;

      // search text
      if (q) {
        const nameMatch = (p.name || '').toLowerCase().includes(q);
        const descMatch = (p.description || '').toLowerCase().includes(q);
        const catMatch = (p.category || '').toLowerCase().includes(q);
        const originMatch = (p.origin || '').toLowerCase().includes(q);
        const certMatch = (p.certLab || '').toLowerCase().includes(q);
        if (!nameMatch && !descMatch && !catMatch && !originMatch && !certMatch) return false;
      }

      // numeric filters
      const price = getProductPrice(p);
      if (filterState.priceMin != null && price < filterState.priceMin) return false;
      if (filterState.priceMax != null && price > filterState.priceMax) return false;

      const ppc = getPricePerCarat(p);
      if (filterState.ppcMin != null && (ppc == null || ppc < filterState.ppcMin)) return false;
      if (filterState.ppcMax != null && (ppc == null || ppc > filterState.ppcMax)) return false;

      const wt = getCaratWeight(p);
      if (filterState.wtMin != null && (wt == null || wt < filterState.wtMin)) return false;
      if (filterState.wtMax != null && (wt == null || wt > filterState.wtMax)) return false;

      const rt = getRattiWeight(p);
      if (filterState.rattiMin != null && (rt == null || rt < filterState.rattiMin)) return false;
      if (filterState.rattiMax != null && (rt == null || rt > filterState.rattiMax)) return false;

      // certification
      if (filterState.certs.length) {
        const certVal = getCertification(p);
        if (!certVal || !filterState.certs.includes(certVal)) return false;
      }

      // origin
      if (filterState.origins.length) {
        const originVal = getOrigin(p);
        if (!originVal || !filterState.origins.includes(originVal)) return false;
      }

      return true;
    });

    if (sort === 'price-asc') out.sort((a, b) => getProductPrice(a) - getProductPrice(b));
    if (sort === 'price-desc') out.sort((a, b) => getProductPrice(b) - getProductPrice(a));
    if (sort === 'name') out.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    return out;
  }

  function renderPagination(pages){
    const el = document.getElementById('pagination');
    el.innerHTML = '';
    if (pages <= 1) return;
    for(let i=1;i<=pages;i++){
      const btn = document.createElement('button');
      btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${i===currentPage ? 'bg-[#0A3A2F] text-[#FBF9F5] shadow-sm' : 'bg-white border border-[#E8E2D5] text-[#4B5563] hover:border-[#C5A869] hover:bg-[#F4EFE6]'}`;
      btn.textContent = i;
      btn.setAttribute('aria-label', `Go to page ${i}`);
      btn.onclick = () => {
        currentPage = i;
        renderProducts();
        window.scrollTo({top: 200, behavior:'smooth'});
      };
      el.appendChild(btn);
    }
  }

  function openProductDetail(id){
    const base = products.find(x => String(x.id) === String(id));
    if(!base) return;
    lastActiveDetailTrigger = document.activeElement;

    const meta = (window.productMeta && window.productMeta[id]) || {};

    // Image & basic headers
    const imgEl = document.getElementById('detail-image');
    if (imgEl) {

      imgEl.alt = p.name ? `${p.name} - Gems of Nature` : 'Natural gemstone';

    if (titleEl) titleEl.textContent = p.name || '';

    const catBadge = document.getElementById('detail-category-badge');
    if (catBadge) catBadge.textContent = p.category || 'Natural Stone';

    if (priceEl) {

    if (priceStatusEl) {
      if (isConfirmed) {

        priceStatusEl.innerHTML = `
          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-800 border border-amber-200">

    }

    // Gemological attributes (Carat, Ratti, Lab, Report #, Origin)
    const gemWrapper = document.getElementById('detail-gemological');
    const gemGrid = document.getElementById('detail-gem-grid');
    const cw = getCaratWeight(p);
    const rw = getRattiWeight(p);
    const certLab = getCertification(p);
    const certNum = p.certNumber || p.cert_number || null;
    const origin = getOrigin(p);

    if (gemWrapper && gemGrid) {
      const gemItems = [];
      if (cw) gemItems.push(`<div><span class="text-stone-500">Weight:</span> <span class="font-semibold text-stone-900">${cw} ct</span></div>`);
      if (rw) gemItems.push(`<div><span class="text-stone-500">Ratti:</span> <span class="font-semibold text-stone-900">${rw} Ratti</span></div>`);
      if (certLab) gemItems.push(`<div><span class="text-stone-500">Laboratory:</span> <span class="font-semibold text-stone-900">${certLab}</span></div>`);
      if (certNum) gemItems.push(`<div><span class="text-stone-500">Report #:</span> <span class="font-semibold text-stone-900">${certNum}</span></div>`);
      if (origin) gemItems.push(`<div><span class="text-stone-500">Origin:</span> <span class="font-semibold text-stone-900">${origin}</span></div>`);

      if (gemItems.length > 0) {
        gemGrid.innerHTML = gemItems.join('');
        gemWrapper.classList.remove('hidden');
      } else {
        gemWrapper.classList.add('hidden');
      }
    }

    // Astrology & Chakra properties
    const spiritualGrid = document.getElementById('detail-spiritual-grid');
    if (spiritualGrid) {
      const spiritualItems = [];
      if (p.planet) {
        spiritualItems.push(`<div class="p-2 rounded-lg bg-stone-50 border border-stone-200"><span class="text-stone-500 block text-[10px]">Ruling Planet</span><span class="font-semibold text-stone-800">${p.planet}</span></div>`);
      }
      const zodiacText = Array.isArray(p.zodiac) ? p.zodiac.join(', ') : (p.zodiac || '');
      if (zodiacText) {
        spiritualItems.push(`<div class="p-2 rounded-lg bg-stone-50 border border-stone-200"><span class="text-stone-500 block text-[10px]">Zodiac Sign</span><span class="font-semibold text-stone-800">${zodiacText}</span></div>`);
      }
      const chakraText = Array.isArray(p.chakra) ? p.chakra.join(', ') : (p.chakra || '');
      if (chakraText) {
        spiritualItems.push(`<div class="p-2 rounded-lg bg-stone-50 border border-stone-200"><span class="text-stone-500 block text-[10px]">Chakra</span><span class="font-semibold text-stone-800">${chakraText}</span></div>`);
      }
      if (spiritualItems.length > 0) {
        spiritualGrid.innerHTML = spiritualItems.join('');
        spiritualGrid.classList.remove('hidden');
      } else {
        spiritualGrid.classList.add('hidden');
      }
    }

    // Rudraksha Mukhi / Deity
    const rudrakshaInfo = document.getElementById('detail-rudraksha-info');
    const mukhiEl = document.getElementById('detail-mukhi');
    const deityEl = document.getElementById('detail-deity');
    if (rudrakshaInfo && (p.mukhi || p.deity)) {
      if (mukhiEl) mukhiEl.textContent = p.mukhi ? `Mukhi: ${p.mukhi} Mukhi` : '';
      if (deityEl) deityEl.textContent = p.deity ? `Ruling Deity: ${p.deity}` : '';
      rudrakshaInfo.classList.remove('hidden');
    } else if (rudrakshaInfo) {
      rudrakshaInfo.classList.add('hidden');
    }

    // Key Benefits
    const benefitsWrapper = document.getElementById('detail-benefits-wrapper');
    const benefitsList = document.getElementById('detail-benefits-list');
    if (benefitsWrapper && benefitsList && Array.isArray(p.benefits) && p.benefits.length > 0) {
      benefitsList.innerHTML = p.benefits.map(b => `<li>${b}</li>`).join('');
      benefitsWrapper.classList.remove('hidden');
    } else if (benefitsWrapper) {
      benefitsWrapper.classList.add('hidden');
    }

    // Sacred Mantra
    const mantraCard = document.getElementById('detail-mantra-card');
    const mantraSanskrit = document.getElementById('detail-mantra-sanskrit');
    const mantraEnglish = document.getElementById('detail-mantra-english');
    const hasSanskrit = Boolean(p.mantra_sanskrit);
    const hasEnglish = Boolean(p.mantra_english || p.mantra);

    if (mantraCard && (hasSanskrit || hasEnglish)) {
      if (mantraSanskrit) mantraSanskrit.textContent = p.mantra_sanskrit || '';
      if (mantraEnglish) mantraEnglish.textContent = p.mantra_english || (hasSanskrit ? '' : (p.mantra || ''));
      mantraCard.classList.remove('hidden');
    } else if (mantraCard) {
      mantraCard.classList.add('hidden');
    }

    // Actions
    if (detailAdd) detailAdd.dataset.id = p.id;

    const waLink = document.getElementById('detail-whatsapp-link');
    if (waLink) {
      const waText = encodeURIComponent(`Hi Gems of Nature, I am interested in ${p.name} (ID: ${p.id}). Please share available natural stones and certified rates.`);
      waLink.href = `https://wa.me/917827491801?text=${waText}`;
    }

    // Show modal and backdrop
    if (detailOverlay) detailOverlay.classList.remove('hidden');
    if (detailPanel) {
      detailPanel.classList.remove('hidden');
      setTimeout(() => detailPanel.classList.add('open'), 10);
      detailPanel.setAttribute('aria-hidden', 'false');
      const closeBtn = document.getElementById('close-detail');
      if (closeBtn) closeBtn.focus();
    }
  }

  function closeProductDetail() {
    if (detailPanel) {
      detailPanel.classList.remove('open');
      detailPanel.setAttribute('aria-hidden', 'true');
      setTimeout(() => detailPanel.classList.add('hidden'), 280);
    }
    if (detailOverlay) detailOverlay.classList.add('hidden');
    if (lastActiveDetailTrigger && typeof lastActiveDetailTrigger.focus === 'function') {
      lastActiveDetailTrigger.focus();
    }
  }

  const closeDetailBtn = document.getElementById('close-detail');
  if (closeDetailBtn) closeDetailBtn.addEventListener('click', closeProductDetail);
  if (detailOverlay) detailOverlay.addEventListener('click', closeProductDetail);

  detailAdd && detailAdd.addEventListener('click', ()=>{
    const id = detailAdd.dataset.id;
    cart[id] = (cart[id]||0)+1;
    saveCart();
    detailAdd.textContent='Added!';
    setTimeout(()=> detailAdd.textContent='🛒 Add to Cart',900);
  });

  // header cart badge & mini cart
  function updateHeaderCartCount(count) {
    const badge = document.getElementById('cartCount'); // badge in header.html
    if (!badge) return;
    badge.textContent = String(count);
  }

  function saveCart(){
    localStorage.setItem('gon_cart', JSON.stringify(cart));
    renderCart();
  }

  function renderCart(){
    // If TypeScript mini-cart adapter is active, delegate to GNMiniCart.render() to prevent duplicate rendering
    if (window.GNMiniCart && typeof window.GNMiniCart.isActive === 'function' && window.GNMiniCart.isActive()) {
      window.GNMiniCart.render();
      return;
    }

    // always grab latest elements (header loads asynchronously)
    const cartMiniItemsEl = document.getElementById('cart-items-mini');
    const cartTotalMiniEl = document.getElementById('cart-total-mini');
    const clearCartMiniBtn = document.getElementById('clear-cart-mini');

    const entries = Object.entries(cart || {});
    let subtotal = 0;

    // reset mini-cart list
    if (cartMiniItemsEl) {
      cartMiniItemsEl.innerHTML = '';
    }

    if (entries.length === 0) {
      if (cartMiniItemsEl) {
        cartMiniItemsEl.innerHTML = '<p class="text-sm text-gray-600">Your cart is empty.</p>';
      }
      if (cartTotalMiniEl) cartTotalMiniEl.textContent = '₹0';
      updateHeaderCartCount(0);
      return;
    }

    // there ARE items
    let minSubtotal = 0;
    let maxSubtotal = 0;
    let hasProv = false;

    entries.forEach(([pid, qty]) => {
      const prod =
        products.find(p => String(p.id) === String(pid)) ||
        { name: pid, image: '/images/hero-bg.jpg' };

      const isConfirmed = prod.pricingStatus === 'INVENTORY_CONFIRMED' && typeof prod.finalPrice === 'number' && prod.finalPrice > 0;
      const min = typeof prod.price_min === 'number' ? prod.price_min : (prod.finalPrice || 0);
      const max = typeof prod.price_max === 'number' ? prod.price_max : min;
      if (!isConfirmed && min !== max) {
        hasProv = true;
      }

      const lineMin = min * qty;
      const lineMax = max * qty;
      minSubtotal += lineMin;
      maxSubtotal += lineMax;

      const unitText = !isConfirmed && min !== max
        ? `${formatCurrency(min, currentCurrency)} – ${formatCurrency(max, currentCurrency)} (est.)`
        : formatCurrency(prod.finalPrice || min, currentCurrency);

      const lineText = !isConfirmed && min !== max
        ? `${formatCurrency(lineMin, currentCurrency)} – ${formatCurrency(lineMax, currentCurrency)}`
        : formatCurrency(lineMin, currentCurrency);

      if (cartMiniItemsEl) {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between gap-2 py-1 border-b border-gray-100 last:border-b-0';
        item.innerHTML = `
          <div class="flex-1">
            <div class="text-xs font-medium text-gray-800">${prod.name || pid}</div>
            <div class="text-[11px] text-gray-500">${qty} × ${unitText}</div>
          </div>
          <div class="text-xs font-semibold text-gray-800">
            ${lineText}
          </div>
        `;
        cartMiniItemsEl.appendChild(item);
      }
    });

    const count = entries.reduce((s, [, q]) => s + Number(q || 0), 0);
    updateHeaderCartCount(count);

    const minTotal = minSubtotal + SHIPPING;
    const maxTotal = maxSubtotal + SHIPPING;
    if (cartTotalMiniEl) {
      cartTotalMiniEl.textContent = hasProv && minTotal !== maxTotal
        ? `${formatCurrency(minTotal, currentCurrency)} – ${formatCurrency(maxTotal, currentCurrency)}`
        : formatCurrency(minTotal, currentCurrency);
    }

    // wire up "Clear Cart" button once header exists
    if (clearCartMiniBtn && !clearCartMiniBtn.dataset.bound) {
      clearCartMiniBtn.dataset.bound = '1';
      clearCartMiniBtn.addEventListener('click', function () {
        if (!confirm('Clear your cart?')) return;
        cart = {};
        localStorage.setItem('gon_cart', JSON.stringify({}));
        renderCart();
      });
    }
  }

  // search / filter events
  ['search-input','sort-select'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const eventType = id === 'sort-select' ? 'change' : 'input';
    el.addEventListener(eventType, () => {
      currentPage = 1;
      renderProducts();
    });
  });

  // currency change
  const currencySelectEl = document.getElementById('currency-select');
  if (currencySelectEl) {
    currencySelectEl.addEventListener('change', (e) => {
      currentCurrency = e.target.value;
      renderProducts();
      renderCart();
    });
  }

  // Handle URL category param (e.g. ?category=Healing, ?category=precious, #rudraksha)
  const params = new URLSearchParams(window.location.search);
  const rawCatParam = params.get('category') || (window.location.hash ? window.location.hash.replace('#', '') : null);

  if (rawCatParam) {
    const cleanCat = decodeURIComponent(rawCatParam).trim().toLowerCase();
    const catSelect = document.getElementById('category-filter');
    const catMap = {
      'precious': 'Precious',
      'precious stones': 'Precious',
      'opal': 'Opal',
      'opal collection': 'Opal',
      'astrology': 'Astrology',
      'astrology & planetary stones': 'Astrology',
      'healing': 'Healing',
      'healing stones': 'Healing',
      'accessory': 'Accessory',
      'accessories': 'Accessory',
      'healing accessories': 'Accessory',
      'rudraksha': 'Rudraksha',
      'rudraksha collection': 'Rudraksha',
      'raw': 'Raw',
      'raw stones': 'Raw',
      'raw crystals': 'Raw',
      'raw crystals & décor': 'Raw'
    };

    const matchedCat = catMap[cleanCat];
    if (matchedCat && catSelect) {
      catSelect.value = matchedCat;
      const catPill = document.querySelector('.filter-pill[data-category]');
      if (catPill) {
        catPill.innerHTML = matchedCat + ' <span class="arrow text-gray-300">&#9662;</span>';
      }
    }
  }

  // initial render
  currentPage = 1;
  renderProducts();
  renderCart();
  updateFilterPillsDisplay();

  // If coming from shop.html or direct link with ?id=pX → open product detail
  const initialId = params.get('id');
  if (initialId) {
    const exists = products.find(p => String(p.id) === String(initialId));
    if (exists) {
      setTimeout(() => openProductDetail(initialId), 300);
    }
  }

  // Modal focus trap & Escape dismissal
  document.addEventListener('keydown', (e) => {
    if (detailPanel && !detailPanel.classList.contains('hidden')) {
      if (e.key === 'Escape') {
        closeProductDetail();
        return;
      }
      if (e.key === 'Tab') {
        const focusable = detailPanel.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) {
            last.focus();
            e.preventDefault();
          }
        } else {
          if (document.activeElement === last) {
            first.focus();
            e.preventDefault();
          }
        }
      }
    }
  });
  </script>
